# =====================================================================
# sync-prospects.yml — OPC Pipeline: GitHub CSV → Google Sheets sync
# =====================================================================
# Triggers when docs/prospect-list.csv changes on main branch.
# Reads the CSV, syncs to Google Sheets via gspread, posts Slack/Discord
# webhook notification, and triggers the Apps Script mail-merge.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICE_ACCOUNT_EMAIL  — service account email (.iam.gserviceaccount.com)
#   GOOGLE_PRIVATE_KEY            — private key (PEM format, with -----BEGIN-----)
#   GOOGLE_SHEET_ID               — the Google Sheet ID (from sheet URL)
#   SLACK_WEBHOOK_URL             — (optional) Slack incoming webhook URL
#   DISCORD_WEBHOOK_URL           — (optional) Discord webhook URL
#   GROQ_API_KEY                  — (optional) for AI enrichment script
# =====================================================================

name: OPC — Sync Prospects to Google Sheets

on:
  push:
    branches: [main]
    paths:
      - 'docs/prospect-list.csv'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🔍 Validate CSV format
        run: |
          python scripts/validate_csv.py docs/prospect-list.csv

      - name: 🔄 Sync CSV → Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scripts/sync_sheets.py \
            --csv docs/prospect-list.csv \
            --sheet-id "$GOOGLE_SHEET_ID" \
            --worksheet "Prospects"

      - name: 🧠 Enrich new prospects (optional, AI)
        if: ${{ env.GROQ_API_KEY != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scripts/enrich_prospects.py \
            --sheet-id "$GOOGLE_SHEET_ID" \
            --worksheet "Prospects" \
            --only-empty-personal-note

      - name: 📊 Generate campaign report
        if: always()
        run: |
          python scripts/generate_report.py \
            --csv docs/prospect-list.csv \
            --output docs/campaign-report.md
          cat docs/campaign-report.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Notify Slack (if configured)
        if: ${{ env.SLACK_WEBHOOK_URL != '' && success() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COUNT=$(python -c "import csv; print(sum(1 for _ in csv.DictReader(open('docs/prospect-list.csv'))))")
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ OPC Pipeline synced $COUNT prospects to Google Sheets. Ready for GMass campaign.\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: 🎯 Commit campaign report
        if: success()
        run: |
          git config --local user.email "opc-bot@aisupplychain.com"
          git config --local user.name "OPC Bot"
          git add docs/campaign-report.md || true
          git diff --staged --quiet || git commit -m "chore(opc): update campaign report [skip ci]"
          git push

      - name: ❌ Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"❌ OPC Pipeline failed in repo ${{ github.repository }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
          echo "Pipeline failed — check logs above"
